<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Training Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module" src="./assets/js/student.js"></script>
</head>
<body class="h-full bg-slate-950 text-slate-100 flex flex-col justify-between font-sans">
    <nav class="bg-slate-900 border-b border-slate-800 px-6 py-4 flex justify-between items-center flex-wrap gap-4">
        <div class="flex items-center gap-4">
            <img id="tenant-logo-img" src="" alt="Organization Logo" class="w-10 h-10 rounded object-contain bg-slate-800 border border-slate-700 hidden">
            <h1 class="text-base font-bold text-blue-400">Student Training Portal</h1>
        </div>
        <div class="flex items-center gap-3">
            <button onclick="window.switchStudentTab('courses')" id="tab-btn-courses" class="px-3 py-1.5 text-xs font-semibold rounded bg-blue-600 text-white transition">Course Library</button>
            <button onclick="window.switchStudentTab('profile')" id="tab-btn-profile" class="px-3 py-1.5 text-xs font-semibold rounded text-slate-300 hover:text-white transition">My Profile</button>
            <button onclick="supabase.auth.signOut().then(() => window.location.href = './index.html')" class="px-3 py-1.5 text-xs font-semibold rounded bg-red-600/20 text-red-400 hover:bg-red-600 transition">Sign Out</button>
        </div>
    </nav>
    <main class="flex-grow max-w-7xl w-full mx-auto px-4 py-8 space-y-8">
        <div id="student-tab-courses" class="space-y-6">
            <div class="space-y-1"><h2 class="text-xl font-bold text-white">Assigned Course Library</h2><p class="text-xs text-slate-400">Select a course module below to begin your training.</p></div>
            <div id="student-course-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
            <div id="lesson-viewer-container" class="mt-8"></div>
        </div>
        <div id="student-tab-profile" class="hidden space-y-6"></div>
    </main>
    <footer class="bg-slate-900 border-t border-slate-800 px-6 py-4 text-center text-xs text-slate-400">
        <p>&copy; 2026 Griffin Consulting Training Institute. Strategy, Performance, People.</p>
    </footer>
</body>
</html>
