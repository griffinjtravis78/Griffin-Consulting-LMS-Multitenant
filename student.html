<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Training Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module" src="./assets/js/student.js"></script>
</head>
<body class="h-full bg-slate-950 text-slate-100 flex flex-col justify-between font-sans">

    <!-- Top Navigation Bar with Dynamic Logo & Multi-Org Switcher -->
    <nav class="bg-slate-900 border-b border-slate-800 px-6 py-4 flex justify-between items-center flex-wrap gap-4">
        <div class="flex items-center gap-4">
            <img id="tenant-logo-img" src="" alt="Organization Logo" class="w-10 h-10 rounded object-contain bg-slate-800 border border-slate-700 hidden">
            <select id="student-org-switcher" onchange="window.switchStudentOrg(this.value)" class="hidden px-3 py-1.5 bg-slate-800 border border-slate-700 rounded-lg text-xs text-purple-300 font-semibold focus:outline-none focus:border-purple-500"></select>
            <h1 class="text-base font-bold text-blue-400">Student Training Portal</h1>
        </div>
        <div class="flex items-center gap-3">
            <a id="ticket-support-link" href="#" target="_blank" class="hidden px-3 py-1.5 text-xs font-semibold rounded bg-purple-600/20 text-purple-300 hover:bg-purple-600 hover:text-white transition">Support Ticket</a>
            <button onclick="supabase.auth.signOut().then(() => window.location.href = './index.html')" class="px-3 py-1.5 text-xs font-semibold rounded bg-red-600/20 text-red-400 hover:bg-red-600 hover:text-white transition">Sign Out</button>
        </div>
    </nav>

    <!-- Main Course Library -->
    <main class="flex-grow max-w-7xl w-full mx-auto px-4 py-8 space-y-8">
        <div class="space-y-2">
            <h2 class="text-xl font-ext500 text-white">Assigned Course Library</h2>
            <p class="text-xs text-slate-400">Select a course module below to begin or review your training progress.</p>
        </div>
        <div id="student-course-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <p class="text-slate-500 text-sm italic">Loading assigned courses...</p>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-slate-900 border-t border-slate-800 px-6 py-4 text-center text-xs text-slate-400 flex justify-between items-center flex-wrap gap-4">
        <div>&copy; 2026 Griffin Consulting. All rights reserved. Strategy | Performance | People.</div>
    </footer>
</body>
</html>
