<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - Griffin Consulting LMS</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between">
    <main class="flex-grow flex items-center justify-center p-6">
        <div class="bg-slate-800 border border-slate-700 p-8 rounded-xl max-w-md w-full shadow-2xl">
            <div class="text-center mb-6">
                <h1 class="text-2xl font-bold text-blue-400">Griffin Consulting LMS</h1>
                <p class="text-xs text-slate-400 mt-1">State Compliance & Professional Licensing Portal</p>
            </div>

            <div id="error-message" class="hidden mb-4 p-3 bg-red-900/40 border border-red-500 text-red-300 text-xs rounded-lg" role="alert"></div>

            <form id="login-form" class="space-y-4">
                <div>
                    <label for="email" class="block text-xs font-medium text-slate-300 mb-1">Email Address</label>
                    <input type="email" id="email" required class="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-lg text-sm text-slate-100 focus:outline-none focus:border-blue-500" placeholder="user@agency.gov">
                </div>
                <div>
                    <label for="password" class="block text-xs font-medium text-slate-300 mb-1">Password</label>
                    <input type="password" id="password" required class="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-lg text-sm text-slate-100 focus:outline-none focus:border-blue-500" placeholder="••••••••">
                </div>
                <button type="submit" class="w-full py-2.5 bg-blue-600 hover:bg-blue-500 text-white font-semibold rounded-lg text-sm transition focus:outline-none focus:ring-2 focus:ring-blue-500">Sign In</button>
            </form>
        </div>
    </main>

    <!-- Universal Legal Footer -->
    <footer class="bg-slate-900 border-t border-slate-800 text-slate-400 text-xs py-6">
        <div class="max-w-7xl mx-auto px-6 flex flex-col md:flex-row justify-between items-center gap-4 text-center md:text-left">
            <p>© 2026 Griffin Consulting. All rights reserved. Strategy | Performance | People.</p>
            <div class="flex flex-wrap gap-4 justify-center">
                <button onclick="window.openLegalModal('terms')" class="hover:text-blue-400 transition focus:outline-none focus:ring-2 focus:ring-blue-500 rounded px-1">Terms of Service</button>
                <button onclick="window.openLegalModal('privacy')" class="hover:text-blue-400 transition focus:outline-none focus:ring-2 focus:ring-blue-500 rounded px-1">Privacy Policy</button>
                <button onclick="window.openLegalModal('ip')" class="hover:text-blue-400 transition focus:outline-none focus:ring-2 focus:ring-blue-500 rounded px-1">IP & Copyright</button>
                <button onclick="window.openLegalModal('outcomes')" class="hover:text-blue-400 transition focus:outline-none focus:ring-2 focus:ring-blue-500 rounded px-1">Outcome Disclaimer</button>
                <button onclick="window.openLegalModal('accessibility')" class="hover:text-blue-400 transition focus:outline-none focus:ring-2 focus:ring-blue-500 rounded px-1">Accessibility</button>
            </div>
        </div>
    </footer>

    <script type="module">
        import { supabase } from './assets/js/app.js';

        const loginForm = document.getElementById('login-form');
        if (loginForm) {
            loginForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                const email = document.getElementById('email').value;
                const password = document.getElementById('password').value;
                const errorElement = document.getElementById('error-message');

                errorElement.classList.add('hidden');

                const { data, error } = await supabase.auth.signInWithPassword({ email, password });

                if (error) {
                    errorElement.textContent = error.message;
                    errorElement.classList.remove('hidden');
                    return;
                }

                const { data: profile, error: profileError } = await supabase
                    .from('profiles')
                    .select('role')
                    .eq('id', data.user.id)
                    .single();

                if (profileError || !profile) {
                    errorElement.textContent = 'User role not assigned. Contact administrator.';
                    errorElement.classList.remove('hidden');
                    return;
                }

                if (profile.role === 'admin') {
                    window.location.href = './admin.html';
                } else {
                    window.location.href = './student.html';
                }
            });
        }
    </script>
</body>
</html>
