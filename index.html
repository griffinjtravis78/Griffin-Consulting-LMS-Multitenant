<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - Griffin Consulting Training Institute</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module" src="./assets/js/app.js"></script>
</head>
<body class="h-full bg-slate-950 text-slate-100 flex flex-col justify-between font-sans">
    <main class="flex-grow flex items-center justify-center px-4">
        <div class="bg-slate-900 border border-slate-800 p-8 rounded-2xl max-w-md w-full shadow-2xl text-center space-y-6">
            <div class="flex flex-col items-center space-y-3">
                <img src="./image_7e43b526.jpg" alt="Institute Seal" class="w-20 h-20 object-contain rounded-full bg-slate-800 p-1 border border-slate-700 shadow-inner">
                <h1 class="text-xl font-bold text-slate-100 tracking-wide">Griffin Consulting Training Institute</h1>
                <p class="text-xs text-slate-400">Secure Multi-Tenant Training & Compliance LMS</p>
            </div>

            <form id="login-form" class="space-y-4 text-left">
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">Email Address</label>
                    <input type="email" id="login-email" required class="w-full px-3 py-2 bg-slate-950 border border-slate-800 rounded-lg text-slate-100 text-xs focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="name@organization.gov">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">Password</label>
                    <input type="password" id="login-password" required class="w-full px-3 py-2 bg-slate-950 border border-slate-800 rounded-lg text-slate-100 text-xs focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="••••••••">
                </div>
                <button type="submit" class="w-full py-2.5 bg-blue-600 hover:bg-blue-500 text-white rounded-lg text-xs font-semibold transition shadow-lg">Sign In</button>
            </form>
        </div>
    </main>

    <footer class="bg-slate-900 border-t border-slate-800 px-6 py-4 text-center text-xs text-slate-400 space-y-1">
        <p>&copy; 2026 Griffin Consulting Training Institute. All rights reserved. Strategy, Performance, People.</p>
        <div class="flex justify-center gap-4 text-[11px] text-slate-500">
            <button onclick="window.openLegalModal('Terms of Service')" class="hover:text-slate-300 transition">Terms of Service</button>
            <span>•</span>
            <button onclick="window.openLegalModal('Privacy Policy')" class="hover:text-slate-300 transition">Privacy Policy</button>
            <span>•</span>
            <button onclick="window.openLegalModal('Legal Disclaimers')" class="hover:text-slate-300 transition">Legal Disclaimers</button>
            <span>•</span>
            <button onclick="window.openLegalModal('Accessibility')" class="hover:text-slate-300 transition">Accessibility (WCAG 2.1 AA)</button>
        </div>
    </footer>

    <!-- Legal Modal Template -->
    <div id="legal-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
        <div class="bg-slate-900 border border-slate-700 rounded-2xl max-w-xl w-full p-6 space-y-4 shadow-2xl relative">
            <h3 id="legal-modal-title" class="text-lg font-bold text-blue-400"></h3>
            <div id="legal-modal-body" class="text-xs text-slate-300 space-y-2 leading-relaxed"></div>
            <div class="pt-4 border-t border-slate-800 flex justify-end">
                <button onclick="window.closeLegalModal()" class="px-4 py-2 bg-blue-600 hover:bg-blue-500 text-white rounded-lg text-xs font-semibold transition">Close</button>
            </div>
        </div>
    </div>
</body>
</html>
