<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - Griffin Consulting Training Institute</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 h-full flex flex-col justify-between font-sans">
    <main class="flex-grow flex items-center justify-center p-6">
        <div class="bg-slate-900 border border-slate-800 p-8 rounded-xl max-w-md w-full shadow-2xl space-y-6">
            <div class="text-center space-y-2">
                <div class="flex justify-center mb-2"><img src="./image_7e43b526.jpg" alt="Institute Seal" class="w-20 h-20 object-contain rounded-full border border-amber-500/30"></div>
                <h1 class="text-xl font-bold text-blue-400">Griffin Consulting Training Institute</h1>
                <p class="text-xs text-slate-400">Strategy, Performance, People</p>
            </div>
            <div id="error-message" class="hidden p-3 bg-red-900/40 border border-red-500 text-red-300 text-xs rounded" role="alert"></div>
            <form id="login-form" class="space-y-4">
                <div><label class="block text-xs font-medium text-slate-300 mb-1">Email Address</label><input type="email" id="email" required class="w-full px-3 py-2 bg-slate-950 border border-slate-700 rounded text-xs text-slate-100 focus:outline-none focus:ring-2 focus:ring-blue-500"></div>
                <div><label class="block text-xs font-medium text-slate-300 mb-1">Password</label><input type="password" id="password" required class="w-full px-3 py-2 bg-slate-950 border border-slate-700 rounded text-xs text-slate-100 focus:outline-none focus:ring-2 focus:ring-blue-500"></div>
                <button type="submit" class="w-full py-2.5 bg-blue-600 hover:bg-blue-500 text-white font-semibold rounded text-xs transition focus:ring-2 focus:ring-blue-500">Sign In</button>
            </form>
        </div>
    </main>
    <footer class="bg-slate-900 border-t border-slate-800 text-slate-400 text-xs py-4 text-center">
        <p>&copy; 2026 Griffin Consulting Training Institute. All rights reserved.</p>
        <div class="flex justify-center gap-4 mt-2">
            <button onclick="window.openLegalModal('terms')" class="hover:text-blue-400">Terms of Service</button>
            <button onclick="window.openLegalModal('privacy')" class="hover:text-blue-400">Privacy Policy</button>
            <button onclick="window.openLegalModal('disclaimer')" class="hover:text-blue-400">Legal Disclaimers</button>
            <button onclick="window.openLegalModal('accessibility')" class="hover:text-blue-400">Accessibility (WCAG 2.1 AA)</button>
        </div>
    </footer>
    <script type="module">
        import { supabase } from './assets/js/app.js';
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const { data, error } = await supabase.auth.signInWithPassword({ email: document.getElementById('email').value, password: document.getElementById('password').value });
            if (error) { const err = document.getElementById('error-message'); err.textContent = error.message; err.classList.remove('hidden'); return; }
            const { data: prof } = await supabase.from('profiles').select('role').eq('id', data.user.id).single();
            window.location.href = prof?.role === 'student' ? './student.html' : './admin.html';
        });
    </script>
</body>
</html>
